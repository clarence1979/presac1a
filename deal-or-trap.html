:root{--navy:#0a0b18;--navy2:#151a2e;--ink:#111827;--muted:#4b5563;--line:#d5dae2;--bg:#f3f5f8;--card:#fff;--cyan:#0e7c9a;--cyan2:#19b5d8;--amber:#f5a623;--red:#b91c1c;--green:#15803d;--blue:#1d4ed8;--focus:#f5a623}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Fredoka,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}

/* header */
.top{flex:0 0 auto;height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px}
.top a.dv{display:flex;align-items:center;line-height:0;border-radius:6px}
.top a.dv img{height:38px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;flex:0 0 auto}
.brand h1{font-weight:900;font-size:19px;letter-spacing:.2px;white-space:nowrap;line-height:1.2}
.brand span{color:#c7d2e0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.badge{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--navy2);border:1px solid #2f3a57;color:#e5ecf5;white-space:nowrap}
.tbtn{background:var(--navy2);border:1px solid #3a4666;color:#fff;border-radius:8px;padding:7px 11px;font-weight:700;font-size:13.5px;white-space:nowrap}
.tbtn:hover{background:#222a45}

/* layout */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.view{position:relative;min-width:0;min-height:0;background:#e9eef3;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:0}
#gl:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}
.stick{position:absolute;left:12px;bottom:12px;width:108px;height:108px;border-radius:50%;background:rgba(10,11,24,.38);border:2px solid rgba(255,255,255,.85);z-index:4;touch-action:none;box-shadow:0 4px 14px rgba(15,23,42,.28);-webkit-user-select:none;user-select:none;cursor:grab}
.stick[hidden],.vbtn[hidden]{display:none}
.stick.on{background:rgba(10,11,24,.5);cursor:grabbing}
.stick .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.4);pointer-events:none}
.stick .ar{position:absolute;width:0;height:0;border:6px solid transparent;pointer-events:none}
.stick .ar.u{left:50%;top:7px;margin-left:-6px;border-bottom-color:#fff;border-top-width:0}
.stick .ar.d{left:50%;bottom:7px;margin-left:-6px;border-top-color:#fff;border-bottom-width:0}
.stick .ar.l{top:50%;left:7px;margin-top:-6px;border-right-color:#fff;border-left-width:0}
.stick .ar.r{top:50%;right:7px;margin-top:-6px;border-left-color:#fff;border-right-width:0}
.vbtn{position:absolute;top:58px;right:10px;z-index:4;border:1px solid var(--line);background:rgba(255,255,255,.95);color:#1f2937;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(15,23,42,.14)}
.vbtn:hover{background:#eef2f7}
.vbtn[aria-disabled="true"]{color:#5b6472;background:rgba(241,243,246,.92);box-shadow:none}
#chips2{display:none}
.hud{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.hud-top{top:8px;display:flex;justify-content:center;padding:0 8px}
.nav{display:flex;gap:4px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 4px 14px rgba(15,23,42,.14);max-width:100%;overflow-x:auto}
.nav button{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-weight:700;font-size:13.5px;white-space:nowrap;color:#1f2937;display:flex;align-items:center;gap:6px}
.nav button:hover{background:#eef2f7}
.nav button[aria-current="true"]{background:var(--navy);color:#fff}
.nav .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.25)}
.nav .cnt{font-size:11px;background:var(--green);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.storecard{position:absolute;top:58px;left:10px;max-width:min(330px,60%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-left:6px solid var(--cyan);border-radius:10px;padding:8px 11px;box-shadow:0 4px 14px rgba(15,23,42,.12);z-index:3}
.storecard b{font-weight:900;font-size:16px}
.storecard small{display:block;color:var(--muted);font-size:12.5px}
.storecard .offer{margin-top:3px;font-size:13.5px}
.hud-bottom{bottom:8px;padding:0 8px;display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 14px rgba(15,23,42,.14)}
.chip{border:1.5px solid #c3cad5;background:#fff;border-radius:9px;padding:5px 10px;text-align:left;line-height:1.2;min-width:104px}
.chip b{display:block;font-size:13.5px;font-weight:700}
.chip small{font-size:11.5px;color:var(--red);font-weight:700}
.chip:hover{border-color:var(--navy);background:#f6f8fb}
.chip.cart{border-color:var(--green);background:#ecfdf3}.chip.cart small{color:var(--green)}
.chip.bought{background:#eef1f5;border-style:dashed}.chip.bought small{color:var(--muted)}
.chip.sold{background:#f1f1f3;color:#4b5563}.chip.sold small{color:#4b5563}
.hint{background:rgba(10,11,24,.86);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.float{position:absolute;z-index:2;transform:translate(-50%,-100%);border:2px solid #fff;background:var(--navy);color:#fff;border-radius:10px;padding:6px 11px;font-weight:900;font-size:14px;line-height:1.15;text-align:center;box-shadow:0 4px 12px rgba(15,23,42,.3);white-space:nowrap}
.float small{display:block;font-weight:700;font-size:11.5px;color:#d5deea}
.float:hover{background:#1c2340}
.float.store{transform:translate(-50%,0)}
.float.pay{background:var(--amber);color:#1a1300;border-color:#1a1300}
.float.pay:hover{background:#ffb93e}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:6;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;max-width:min(92%,520px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
#loading{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:1;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;color:#1f2937}
#loading[hidden]{display:none}
#storecard2{display:none}
#storecard2[hidden]{display:none!important}
#flat{display:none}
.no3d #gl,.no3d .float{display:none}
.no3d #flat{display:flex;position:absolute;inset:56px 10px 10px 10px;align-items:center;justify-content:center;overflow:auto}
.no3d .view{background:linear-gradient(#dfe8f1,#f4efe6)}
.no3d .hud-bottom .chips{display:none}
.no3d #chips2,.no3d .stick,.no3d .vbtn{display:none!important}
.flatgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%;max-width:860px}
.flatcard{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;border-top-width:8px}
.flatcard b{display:block;font-weight:900;font-size:16px}.flatcard small{color:var(--muted)}
.flatcard .sg{display:inline-block;margin-top:6px;background:var(--red);color:#fff;font-weight:900;border-radius:6px;padding:2px 8px;font-size:13px}

/* side panel */
.side{background:var(--card);border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
.wallet{display:flex;gap:8px}
.wallet .box{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#f8fafc}
.wallet small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wallet b{font-size:22px;font-weight:900}
.wallet .owed b{color:var(--red)}
.sec h2{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.needs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.needs li{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center;padding:4px 8px;border-bottom:1px solid #e8ecf1;min-height:39px}
.needs li:last-child{border-bottom:0}
.needs .ic{width:22px;height:22px;border-radius:50%;border:2px solid #7b8494;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.needs li.ok .ic{background:var(--green);border-color:var(--green)}
.needs li.bad .ic{background:var(--red);border-color:var(--red)}
.needs b{font-size:14px;font-weight:700;display:block;line-height:1.15}
.needs small{font-size:12px;color:var(--muted);line-height:1.15;display:block}
.needs .st{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;max-width:74px;line-height:1.1}
.needs li.ok .st{color:var(--green)}.needs li.bad .st{color:var(--red)}
.cart{flex:1 1 auto;min-height:92px;display:flex;flex-direction:column}
.cartlist{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fbfcfd}
.cartlist .empty{padding:12px;color:var(--muted);font-size:13.5px}
.cline{display:grid;grid-template-columns:1fr auto 30px;gap:6px;align-items:center;padding:5px 6px 5px 9px;border-bottom:1px solid #e8ecf1}
.cline:last-child{border-bottom:0}
.cline b{font-size:13.5px;font-weight:700;display:block;line-height:1.15}
.cline small{font-size:12px;color:var(--muted)}
.cline .pr{font-weight:900;font-size:14px;text-align:right}
.cline .pr.q{color:var(--muted);font-weight:700;font-size:12px;max-width:74px;line-height:1.1}
.xbtn{width:28px;height:28px;border-radius:7px;border:1px solid #c3cad5;background:#fff;font-weight:900;line-height:1;color:#374151}
.xbtn:hover{background:#fee2e2;border-color:var(--red)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;font-size:15px;background:var(--navy);color:#fff}
.btn:hover{background:#1c2340}
.btn.pri{background:var(--amber);color:#1a1300}.btn.pri:hover{background:#ffb93e}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #b6bfcc}.btn.ghost:hover{background:#f1f4f8}
.btn.go{background:var(--green);color:#fff}.btn.go:hover{background:#136c34}
.btn[aria-disabled="true"]{background:#d7dce4;color:#4b5563;border-color:#d7dce4}
.btn[aria-disabled="true"]:hover{background:#d7dce4}
.row{display:flex;gap:8px}.row>*{flex:1}
.side .btn{width:100%}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(10,11,24,.62);z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(900px,100%)}
.modal header{padding:13px 18px 9px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.modal header h2{font-size:21px;font-weight:900;line-height:1.2;flex:1}
.modal header small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.modal .body{padding:13px 18px;overflow:auto;flex:1 1 auto;min-height:0}
.modal footer{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.closex{border:1px solid #c3cad5;background:#fff;border-radius:8px;width:34px;height:34px;font-weight:900;font-size:16px;line-height:1}
.closex:hover{background:#f1f4f8}
.lead{font-size:16px}
.muted{color:var(--muted)}
.brandstrip{background:var(--navy);padding:12px 18px;display:flex;align-items:center;gap:14px}
.brandstrip img.lock{height:54px;width:auto}
.brandstrip .ttl{color:#fff}.brandstrip .ttl b{display:block;font-size:26px;font-weight:900;line-height:1.1}.brandstrip .ttl span{color:#c7d2e0;font-size:14px}
.brandstrip img.app{width:48px;height:48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:block;cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .ob{display:block;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff}
.opt b{display:block;font-weight:900;font-size:15.5px}.opt small{color:var(--muted);font-size:13px;display:block}
.opt input:checked+.ob{border-color:var(--navy);background:#f1f5fb;box-shadow:inset 0 0 0 1px var(--navy)}
.opt input:focus-visible+.ob{outline:3px solid var(--focus);outline-offset:2px}
.opt input:disabled+.ob{opacity:.75;background:#f3f4f6;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:3px}
.field label,.lbl{font-weight:700;font-size:13.5px}
.field input,.field select{border:1.5px solid #9aa4b2;border-radius:8px;padding:8px 10px;background:#fff;min-height:42px;font-size:16px}
.steps{margin:8px 0 0;padding-left:20px}.steps li{margin:3px 0}
.tag{background:var(--red);color:#fff;border-radius:12px;padding:10px 14px;position:relative}
.tag .was{font-size:13.5px;font-weight:700;opacity:.95}
.tag .deal{font-size:25px;font-weight:900;line-height:1.1;color:#ffe45c}
.tag .deal2{font-size:18px;font-weight:900;line-height:1.15}
.tag .fine{font-size:12.5px;margin-top:4px;opacity:.95}
.tag.sold{background:#3f3f46}
.specs{margin:6px 0 0;padding-left:19px}.specs li{margin:1px 0}
.note{border-radius:10px;padding:8px 11px;font-size:14px;border:1px solid}
.note.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.note.ok{background:#ecfdf3;border-color:#a7e3bd;color:#14532d}
.note.bad{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
.note.warn{background:#fff7e6;border-color:#f8d48a;color:#6b4a00}
.note b{font-weight:900}
.mathbox{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafbfc}
.money{display:flex;align-items:center;gap:6px}
.money span{font-weight:900;font-size:18px}
.money input{width:120px;border:1.5px solid #9aa4b2;border-radius:8px;padding:8px 10px;font-weight:700;font-size:17px;min-height:42px}
.qty{display:inline-flex;border:1.5px solid #9aa4b2;border-radius:9px;overflow:hidden}
.qty button{border:0;background:#fff;padding:7px 14px;font-weight:900}
.qty button[aria-pressed="true"]{background:var(--navy);color:#fff}
.stack{display:flex;flex-direction:column;gap:10px}
.cashier{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:0 0 auto;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.bubble{background:#f1f5fb;border:1px solid #cfd8e6;border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:15.5px}
table.rc{width:100%;border-collapse:collapse;font-size:14px}
table.rc th,table.rc td{padding:4px 6px;border-bottom:1px solid #e8ecf1;text-align:left;vertical-align:top}
table.rc td.n,table.rc th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rc tr.tot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0;font-size:16px}
table.rc tr.sub td{font-weight:700}
table.rc small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#f8fafc}
.stat small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat b{font-size:21px;font-weight:900}
.stars{font-size:22px;letter-spacing:2px;color:#b45309}
.verdict{border:1px solid var(--line);border-left:7px solid #64748b;border-radius:10px;padding:8px 11px;background:#fff}
.verdict.deal{border-left-color:var(--green)}.verdict.trap{border-left-color:var(--red)}
.verdict .k{font-size:11.5px;font-weight:900;letter-spacing:.6px}
.verdict.deal .k{color:var(--green)}.verdict.trap .k{color:var(--red)}.verdict.info .k{color:#334155}
.verdict b{font-weight:900}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h3.h{font-size:15px;font-weight:900;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px;color:#1f2937}
details.gl{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
details.gl summary{font-weight:900;cursor:pointer}
dl.terms{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
dl.terms dt{font-weight:900}dl.terms dd{margin:0}
.err{color:var(--red);font-weight:700;font-size:13.5px;min-height:18px}
#print{display:none}

@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr) 312px}.brand span{display:none}}
@media (max-width:860px){
  body{height:auto;min-height:100dvh;overflow:auto}
  .stage{display:block}
  .view{height:56vh;min-height:330px}
  .side{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .cartlist{max-height:none}
  .stats{grid-template-columns:1fr 1fr}.vgrid,.grid2{grid-template-columns:1fr}
  .top{height:auto;min-height:52px;flex-wrap:wrap;padding:6px 10px}
  .badge.tax{display:none}
  #storecard{display:none}
  #storecard2{display:block;position:static;max-width:none;box-shadow:none}
  #chips2{display:block}#chips2[hidden]{display:none}
  #chips2 .chips{box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0;justify-content:flex-start;background:#fff}
  .vbtn{top:54px;right:8px;padding:6px 10px;font-size:13px}
  .float{font-size:12.5px;padding:4px 9px}.float small{font-size:10.5px}
  .chip{min-width:0;padding:5px 8px}
}
@media (max-width:640px){.float.store{font-size:11px;line-height:1.1;padding:3px 5px;border-width:1.5px;border-radius:7px;white-space:normal;width:min-content;min-width:52px;max-width:70px}.float.store small{display:none}}
@media (max-height:640px) and (min-width:861px){.needs li{min-height:34px;padding:2px 8px}.wallet b{font-size:19px}.top{height:46px}}
/* ================= glossy game skin ================= */
:root{--navy:#0b1437;--navy2:#16235c;--ink:#14204f;--muted:#4a5578;--line:#d6dcf0;--bg:#eef1ff;--cyan:#0a7ea4;--amber:#ffc928;--red:#c8102e;--green:#178038;--focus:#ff8a00}
body{font-weight:400;letter-spacing:.1px;background:#e9ecff}
b,strong{font-weight:600}
.ico{width:1.15em;height:1.15em;fill:currentColor;flex:0 0 auto;display:block}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px rgba(255,255,255,.9)}
/* header */
.top{height:60px;background:radial-gradient(circle at 18% 0,#1b2f7d 0,rgba(27,47,125,0) 46%),linear-gradient(180deg,#0f1c50,#0a1233);border-bottom:3px solid #2445b8;gap:10px;padding:0 14px}
.top a.dv img{height:40px}
.brand img{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.brand h1{font-weight:700;font-size:27px;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.brand h1 em{font-style:normal;color:#ffd21f;position:relative;display:inline-block;transform:rotate(-4deg);margin-left:2px}
.brand h1 em::after{content:"";position:absolute;left:-3px;right:-5px;bottom:-4px;height:5px;background:#ff3b3b;border-radius:5px 60% 5px 50%;transform:rotate(-1.5deg)}
.brand span{color:#cfd9ff;font-size:14px}
.badge,.tbtn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#16297a,#0e1a4d);border:2px solid #3aa0ff;box-shadow:0 0 12px rgba(58,160,255,.55),inset 0 1px 0 rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:5px 12px 5px 7px;font-weight:600;font-size:14.5px;min-height:36px}
.badge.tax{padding-left:12px}
.tbtn:hover{background:linear-gradient(180deg,#1d3493,#122060)}
.tbtn:active{transform:translateY(1px)}
.pic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-weight:700;font-size:17px;line-height:1}
.pic.tg{background:#fff;color:#e02424}.pic.tg .ico{width:22px;height:22px}
.pic.qm{background:linear-gradient(180deg,#39d5ff,#1493d6);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pic.rs{color:#39d5ff}.pic.rs .ico{width:22px;height:22px}
/* 3D view chrome */
.view{background:linear-gradient(180deg,#8fd0ff 0,#d9f0ff 45%,#f7efe2 100%)}
.nav{gap:4px;background:#fff;border:0;border-radius:20px;padding:5px;box-shadow:0 5px 0 rgba(20,32,79,.12),0 10px 22px rgba(20,32,79,.25)}
.nav button{border-radius:15px;padding:8px 13px;font-weight:600;font-size:15px;color:var(--ink);gap:7px}
.nav button:hover{background:#eef1ff}
.nav button[aria-current="true"]{background:linear-gradient(180deg,#1f3080,#0e1740);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 3px 0 #060a22}
.nav button .ico{width:19px;height:19px;color:#ffc928}
.nav .dot{width:15px;height:15px;border:0;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 46%),var(--c1,#888);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 1px 0 rgba(0,0,0,.15)}
.nav .cnt{font-size:11.5px;font-weight:600;background:var(--green);padding:0 7px;line-height:18px}
.vbtn{display:flex;align-items:center;gap:6px;border:0;border-radius:14px;background:#fff;color:#33415f;font-weight:600;font-size:15px;padding:8px 13px 8px 10px;box-shadow:0 4px 0 rgba(20,32,79,.16),0 8px 18px rgba(20,32,79,.22)}

<div class="body stack" tabindex="0" role="group" aria-label="About this game">
<p class="lead"><b>Every sign in this mall says SALE.</b> Your job is to find out which deals are real.</p>
<p>You are 19 and paying your own way. You have <b>$400.00</b> in your checking account and <b>five things you need</b>. Read each tag, do the math, and get everything on your list for as little as you can.</p>
<div class="note info"><b>Why this matters:</b> stores design their signs to make you spend more. Shoppers who can check a discount on a phone calculator keep that money for themselves.</div>
<fieldset style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:4px">Choose your level</legend><div class="grid2">
<label class="opt"><input type="radio" name="lvl" value="1" ${n.level===1?"checked":""}><span class="ob"><b>Level 1: Deal Detective</b><small>Percent off, stacked discounts, coupons, BOGO and sales tax. Best for Grades 7 to 8 or a first play.</small></span></label>
<label class="opt"><input type="radio" name="lvl" value="2" ${n.level===2?"checked":""}><span class="ob"><b>Level 2: Full Checkout</b><small>Everything in Level 1, plus pay-in-4, a store credit card, and what happens over the next 8 weeks. Best for Grades 9 to 12.</small></span></label>
</div></fieldset>
<div class="grid2">
<div class="field"><label for="inTax">Sales tax rate (ask your teacher)</label><select id="inTax">${mr.map(t=>`<option value="${t}" ${t===n.taxBp?"selected":""}>${yi(t)}</option>`).join("")}</select></div>
<div class="field"><label for="inName">Your name (optional, for your report)</label><input id="inName" type="text" maxlength="40" autocomplete="off" value="${Ct(n.name||"")}"></div>
</div>
<p class="muted" style="font-size:13px">Works offline. Nothing you type leaves this device, and nothing is saved when you close the page.</p>
</div>
<footer><button class="btn ghost" type="button" data-act="howto">How to play</button><button class="btn pri" type="button" data-act="start">Start shopping</button></footer>`})}ye.start=()=>{let n=+(ft('input[name="lvl"]:checked',Ue)||{value:1}).value,t=+ft("#inTax",Ue).value,e=ft("#inName",Ue).value.trim();Z=gg(n,t,e),Ni(!0),qh(),Ui(),Dn("Welcome to the mall. Click or tap a store to go inside.");let i=ft("#nav button");i&&i.focus()};ye.howto=()=>{let n=!Z;ui({title:"How to play",body:Hh+Vh(),footer:`<button class="btn pri" type="button" data-act="${n?"backstart":"close"}">${n?"Back":"Got it"}</button>`,closable:!n,focus:"footer .btn"})};ye.backstart=()=>{Qe=null,xl()};function Vh(){return`<details class="gl" open><summary>Words on the signs</summary><dl class="terms">${xg.map(([n,t])=>`<dt>${n}</dt><dd>${t}</dd>`).join("")}</dl></details>
