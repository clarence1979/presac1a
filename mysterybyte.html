<style>
  :root { --bg: #070a12; --gold: #c9a227; --cream: #f3e9d2; --cyan: #4fe3ff; --navy: #121a2b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body.town { background: linear-gradient(180deg, #dbeeff 0%, #eef4f8 60%, #e6ebf0 100%); color: #1f2937; }
  body.town button { background: #ffffff; color: #1f2937; border-color: #c7d2de; } body.town button:hover { background: #eef4ff; } body.town button.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  body.town canvas { background: #9fd6f5; border-color: #c7d2de; box-shadow: 0 20px 50px rgba(30,60,100,.25); }
  body { background: radial-gradient(ellipse at 50% 0%, #17203a 0%, var(--bg) 60%); color: var(--cream); font-family: 'Trebuchet MS', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100%; }
  header { width: min(96vw, 1180px, calc((100vh - 140px) * 16 / 9)); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; margin: 10px 0 8px; background: #090a17; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); box-sizing: border-box; }
  body.town header { color: #fff; }
  body.town header button { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.22); } body.town header button:hover { background: rgba(255,255,255,.16); } body.town header button.primary { background: #3b82f6; border-color: #3b82f6; }
  .brand { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; letter-spacing: .12em; color: #ff3c78; text-shadow: 0 0 12px rgba(255,60,120,.6); white-space: nowrap; }
  .brand small { color: var(--cyan); text-shadow: 0 0 10px rgba(79,227,255,.5); letter-spacing: .04em; font-size: 12px; margin-left: 10px; font-style: italic; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button { background: var(--navy); color: var(--cream); border: 1px solid var(--gold); border-radius: 6px; padding: 6px 12px; font: 600 13px 'Trebuchet MS', 'Segoe UI', sans-serif; cursor: pointer; letter-spacing: .02em; transition: background .15s, transform .05s; }
  button:hover { background: #1c2740; } button:active { transform: translateY(1px); }
  button.primary { background: var(--gold); color: #1a1408; }
  button.primary:hover { background: #dcb63a; }
  #stage { width: min(96vw, 1180px, calc((100vh - 140px) * 16 / 9)); aspect-ratio: 16 / 9; position: relative; }
  canvas { width: 100%; height: 100%; display: block; background: #05070d; border: 1px solid #2a3350; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(201,162,39,.15); outline: none; image-rendering: auto; }
  footer { width: min(96vw, 1180px, calc((100vh - 140px) * 16 / 9)); display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px 16px; color: #8a93a6; font-size: 12px; flex-wrap: wrap; }
  footer a { color: var(--cyan); text-decoration: none; }
  #loadfile { display: none; }
  #dv-logo { display: inline-block; margin-right: 14px; vertical-align: middle; line-height: 0; transition: transform .12s, opacity .12s; }
  #dv-logo:hover { transform: translateY(-1px) scale(1.03); opacity: .9; }
  #dv-logo-img { height: 46px; width: auto; display: block; }
  .brand { display: flex; align-items: center; }
  @media (max-width: 720px) { .brand small { display: none; } button { padding: 6px 8px; font-size: 12px; } }
</style>

  step() { this.noise(0.06, 0.035, 0); },
  tick() { this.tone(1800, 0.02, 'square', 0.012); },
  blip() { this.tone(660, 0.07, 'triangle', 0.06, 990); },
  ok() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, 'triangle', 0.07), i * 90)); },
  bad() { this.tone(180, 0.25, 'sawtooth', 0.05, 120); },
  clue() { [880, 1320].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, 'sine', 0.06), i * 110)); },
  open() { this.tone(300, 0.15, 'triangle', 0.05, 520); },
  fanfare() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, 'triangle', 0.08), i * 120)); },

function floorScale(sc, y) {
  const f = sc.floor, k = clamp((y - f.top) / (f.bottom - f.top), 0, 1);
  return lerp(sc.scaleRange[0], sc.scaleRange[1], k);
}
function floorBounds(sc, y) {
  const f = sc.floor, k = clamp((y - f.top) / (f.bottom - f.top), 0, 1);
  return [lerp(f.l[0], f.l[1], k), lerp(f.r[0], f.r[1], k)];
}
function perspectiveFloor(ctx, top, bottom, colA, colB, rows, cols, vx, vy) {
  for (let r = 0; r < rows; r++) {
    const y0 = top + (bottom - top) * (r / rows) ** 1.35, y1 = top + (bottom - top) * ((r + 1) / rows) ** 1.35;
    for (let c = 0; c < cols; c++) {
      const xa0 = lerp(vx, -200 + (W + 400) * c / cols, (y0 - vy) / (bottom - vy)), xa1 = lerp(vx, -200 + (W + 400) * (c + 1) / cols, (y0 - vy) / (bottom - vy));
      const xb0 = lerp(vx, -200 + (W + 400) * c / cols, (y1 - vy) / (bottom - vy)), xb1 = lerp(vx, -200 + (W + 400) * (c + 1) / cols, (y1 - vy) / (bottom - vy));
      ctx.fillStyle = (r + c) % 2 ? colA : colB;
      ctx.beginPath(); ctx.moveTo(xa0, y0); ctx.lineTo(xa1, y0); ctx.lineTo(xb1, y1); ctx.lineTo(xb0, y1); ctx.closePath(); ctx.fill();
    }
  }
}

/* ---------- dialogue engine ---------- */
function say(who, t) { return { who, text: t }; }
function startDialog(steps, onDone) {
  G.dialog = { q: steps.slice(), cur: null, shown: 0, onDone, paused: false };
  G.mode = 'dialog'; faceNPCs(); nextStep();
}
function insert(steps) { if (G.dialog) G.dialog.q.unshift(...steps); }
function nextStep() {
  const d = G.dialog; if (!d) return;
  while (d.q.length) {
    const s = d.q.shift();
    if (typeof s === 'function') { s(); if (G.mode === 'puzzle') { d.paused = true; d.cur = null; return; } continue; }
    if (s.dyn) s.choices = s.dyn();
    d.cur = s; d.shown = 0; d.stepT = 0; return;
  }
  G.dialog = null; if (G.mode === 'dialog') G.mode = 'walk'; if (d.onDone) d.onDone();
}
function dialogKey(k) {
  const d = G.dialog; if (!d || !d.cur) return;
  const cur = d.cur, full = cur.text.length;
  if (cur.choices) {
    if (d.shown < full) { d.shown = full; return; }
    const n = parseInt(k, 10);
    if (n >= 1 && n <= cur.choices.length) {
      const c = cur.choices[n - 1]; SFX.blip();
      const steps = [];
      if (cur.echo !== false && !c.noEcho) steps.push(say('player', c.t));
      if (c.steps) steps.push(...c.steps);
      if (c.fn) steps.push(c.fn);
      insert(steps); nextStep();
    }
    return;
  }
  if (k === 'Enter' || k === ' ' || k === 'e') {
    if (d.shown < full) { d.shown = full; return; }
    nextStep();
  }
}
function faceNPCs() {
  const sc = SCENES[G.scene]; if (!sc) return;
  for (const a of sc.actors) if (!a.static) a.facing = a.x > G.player.x ? -1 : 1;
  G.player.facing = G.player.facing;
}
/* topic menu that re-shows itself until the player leaves */
function menu(who, prompt, topics, leaveText) {
  const step = { who, text: prompt, echo: true };
  step.dyn = () => {
    const ch = topics.filter(t => !t.if || t.if()).filter(t => !(t.once && G.flags['topic_' + t.once])).map(t => ({
      t: t.t, fn: () => { if (t.once) G.flags['topic_' + t.once] = true; if (t.fn) t.fn(); insert([...(t.steps || []), ...(t.end ? [] : [step])]); },
    }));
    ch.push({ t: leaveText || 'That’s all for now.', fn: () => {} });
    return ch;
  };
  return step;
}
/* multiple-choice quiz inside dialogue: qs = [{id, q, a:[..], c:index, why}] */
function quiz(who, qs, onDone) {
  const steps = [];
  const ask = (q) => {
    const step = { who, text: q.q, echo: false };
    step.choices = q.a.map((t, i) => ({
      t, fn: () => {
        if (i === q.c) { solvedPuzzle(q.id); SFX.ok(); insert([say(who, q.yes || 'Correct.')]); }
        else { wrongAnswer(q.id); SFX.bad(); insert([say(who, (q.why || 'Not quite.') + ' Let’s try that one again.'), ask(q)]); }
      },
    }));
    return step;
  };
  qs.forEach(q => steps.push(ask(q)));
  if (onDone) steps.push(onDone);
  return steps;
}
function solvedPuzzle(id) {
  if (G.puzzles[id]) return;
  G.puzzles[id] = true; G.stats.solved++;
  if (!G.attempts[id]) G.stats.firstTry++;
}
function wrongAnswer(id) { G.attempts[id] = (G.attempts[id] || 0) + 1; G.stats.wrong++; }
function radioHint() {
  if (G.mode === 'puzzle' && G.puzzle) { G.puzzle.showHint(); return; }
  if (G.mode !== 'walk') return;
  G.stats.hints++;
  startDialog([say('radio', OBJECTIVES[G.objective].hint)]);
}

/* ============================================================

  { id: 'motherboard', t: 'motherboard', re: /\bmotherboard\b/i, d: 'The main circuit board that every other component plugs into.' },

  { id: 'output', t: 'output device', re: /\boutput device/i, d: 'Shows results: monitor, printer, speakers, projector.' },
  { id: 'binary', t: 'binary', re: /\bbinary\b/i, d: 'Base 2 — digits 0 and 1. Each bit is worth a power of two (1, 2, 4, 8, 16…).' },
  { id: 'bit', t: 'bit', re: /\b(bits?)\b/i, d: 'One binary digit. Eight bits make a byte (0–255).' },
  { id: 'byte', t: 'byte', re: /\bbytes?\b/i, d: 'Eight bits. One byte holds values 0–255 — exactly one part of an IPv4 address.' },
  { id: 'hex', t: 'hexadecimal', re: /\b(hexadecimal|hex)\b/i, d: 'Base 16 — digits 0–9 and A–F. One hex digit is four bits; two hex digits are one byte. Written with 0x.' },
  { id: 'octal', t: 'octal', re: /\boctal\b/i, d: 'Base 8 — digits 0–7. Place values 1, 8, 64, 512.' },
  { id: 'ip', t: 'IP address', re: /\bIP address(es)?\b/i, d: 'A device’s address on a network — four numbers from 0 to 255, like 192.168.0.25.' },
  { id: 'dns', t: 'DNS', re: /\bDNS\b/, d: 'Domain Name System — the internet’s phone book. Turns a name like boolelab.net into an IP address.' },

  { id: 'seq', t: 'sequence number', re: /\bsequence numbers?\b/i, d: 'The “page 3 of 6” label on a packet so the receiver can put the message back in order.' },

  { id: 'eviltwin', t: 'evil twin', re: /\bevil twin\b/i, d: 'A rogue Wi-Fi hotspot that copies a real network’s name so people connect to it by mistake.' },

const VOCAB_BY_ID = Object.fromEntries(VOCAB.map(v => [v.id, v]));

/* Split a line of text into [{text, word?}] runs so bubbles can draw chips. */
function tokenizeVocab(line) {
  const hits = [];
  for (const v of VOCAB) { const re = new RegExp(v.re.source, v.re.flags.includes('g') ? v.re.flags : v.re.flags + 'g'); let m; while ((m = re.exec(line))) { hits.push({ s: m.index, e: m.index + m[0].length, v }); if (!m[0].length) re.lastIndex++; } }
  hits.sort((a, b) => a.s - b.s || b.e - a.e);
  const out = []; let pos = 0;
  for (const h of hits) { if (h.s < pos) continue; if (h.s > pos) out.push({ text: line.slice(pos, h.s) }); out.push({ text: line.slice(h.s, h.e), word: h.v }); pos = h.e; }
  if (pos < line.length) out.push({ text: line.slice(pos) });
  return out;
}
function wordsIn(textStr) { const ids = []; for (const v of VOCAB) if (v.re.test(textStr) && !ids.includes(v.id)) ids.push(v.id); return ids; }
function hasWord(id) { return G.words.includes(id); }
function collectWords(ids, src) {
  const fresh = ids.filter(id => !hasWord(id));
  if (!fresh.length) { if (ids.length) toast('Already in your word bank.'); return 0; }
  fresh.forEach(id => G.words.push(id)); SFX.ok();
  const names = fresh.map(id => VOCAB_BY_ID[id].t);
  toast(`Word bank +${fresh.length}: ${names.join(', ')}`, 'clue');
  G.wordFlash = { t: 0, ids: fresh };
  return fresh.length;
}

/* ============================================================
   PUZZLES — panel framework + every mini-game
   ============================================================ */
const PANEL = { x: 80, y: 40, w: 800, h: 460 };
const COL = { cream: '#f3e9d2', gold: '#c9a227', dim: '#9aa3b5', ok: '#7ee787', bad: '#ff7b72', cyan: '#4fe3ff', navy: '#0e1420' };

function openPuzzle(p) {
  p.t = 0; G.puzzle = p; G.mode = 'puzzle'; SFX.open();
  if (p.onOpen) p.onOpen();
}
function resumePausedDialog() {
  const d = G.dialog;
  if (d && d.paused) { d.paused = false; G.mode = 'dialog'; nextStep(); }
  else if (G.mode === 'puzzle') G.mode = 'walk';
}
function closePuzzle() {           // cancel with Escape
  if (!G.puzzle) return;
  G.puzzle = null; resumePausedDialog();
}
/* clickable regions registered by puzzle renders: {x,y,w,h,key} — pointerDown turns a click into the same key press */
let PUZ_HITS = [];
function hitRect(x, y, w, h, key) { PUZ_HITS.push({ x, y, w, h, key }); }
function puzzleClick(pt) {
  const p = G.puzzle; if (!p) return false;
  const h = PUZ_HITS.find(r => pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h);
  if (h) { p.key(h.key); return true; }
  if (p.clickAdvances && p.clickAdvances()) { p.key('Enter'); return true; }
  return false;
}
function finishPuzzle() {          // solved: clean up, resume/close the paused dialog, then continue the story
  const p = G.puzzle; if (!p) return;
  G.puzzle = null; resumePausedDialog();
  if (p.onSolved) p.onSolved();
}

/* ============================================================
   Typed-answer puzzle (single or multi-round, panel or terminal)
   ============================================================ */
function inputPuzzle(o) {
  const rounds = o.rounds ? o.rounds.map(r => Object.assign({}, o, r)) : [o];
  const p = {
    id: o.id, title: o.title, terminal: !!o.terminal, t: 0, buf: '', msg: null, kind: 'info', hintShown: false,
    done: false, doneT: 0, round: 0, rounds, log: [], onSolved: o.onSolved, success: o.success, wrongHere: 0,
    cur() { return this.rounds[this.round]; },
    roundId() { return this.rounds.length > 1 ? `${this.id}.${this.round + 1}` : this.id; },
    onOpen() { if (this.terminal) this.log.push({ t: this.cur().prompt, c: COL.cream }); },
    showHint() {
      const c = this.cur(); if (!c.hint) return;
      if (!this.hintShown) { this.hintShown = true; G.stats.hints++; SFX.blip(); }
      if (this.terminal) this.log.push({ t: 'PIP (radio): ' + c.hint, c: COL.gold });
    },
    key(k) {
      if (this.done) return;
      const c = this.cur(), allowed = c.allowed || /[0-9a-zA-Z:. \-]/, maxLen = c.maxLen || 24;
      if (k === 'Enter') { this.submit(); return; }
      if (k === 'Backspace') { this.buf = this.buf.slice(0, -1); return; }
      if (k === 'F1') { this.showHint(); return; }
      if (k.length === 1) {
        if (allowed.test(k)) { if (this.buf.length < maxLen) { this.buf += k; SFX.tick(); } }
        else if (k === 'h' || k === 'H') this.showHint();
      }
    },
    submit() {
      const a = this.buf.trim(); if (!a) return;
      const c = this.cur();
      if (this.terminal) this.log.push({ t: '> ' + a, c: COL.cyan });
      if (c.check(a)) {
        solvedPuzzle(this.roundId()); this.buf = ''; this.hintShown = false; this.wrongHere = 0;
        if (this.round < this.rounds.length - 1) {
          this.round++; SFX.ok(); this.msg = 'Correct.'; this.kind = 'ok';
          if (this.terminal) { this.log.push({ t: 'CORRECT.', c: COL.ok }); this.log.push({ t: this.cur().prompt, c: COL.cream }); }
        } else {
          this.done = true; this.doneT = 0; SFX.ok(); this.msg = this.success || 'Correct.'; this.kind = 'ok';
          if (this.terminal) this.log.push({ t: this.msg, c: COL.ok });
        }
      } else {
        wrongAnswer(this.roundId()); this.wrongHere++; SFX.bad(); this.buf = '';
        this.msg = this.wrongHere >= 2 ? 'Not quite. Press H if you want a hint from Pip.' : 'Not quite — try again.'; this.kind = 'bad';
        if (this.terminal) this.log.push({ t: this.msg, c: COL.bad });
        if (this.wrongHere >= 3) this.showHint();
      }
    },
    update(dt) { this.t += dt; if (this.done) { this.doneT += dt; if (this.doneT > 1.4) finishPuzzle(); } },
    render(ctx) { this.terminal ? renderTerminal(ctx, this) : renderInputPanel(ctx, this); },
  };
  return p;
}
function renderInputPanel(ctx, p) {
  const c = p.cur();
  panelFrame(ctx, p.title);
  text(ctx, c.prompt, PANEL.x + 28, PANEL.y + 78, { font: `16px ${FONT_UI}`, color: COL.cream, maxWidth: PANEL.w - 56, lineHeight: 21 });
  if (c.draw) { ctx.save(); c.draw(ctx, p); ctx.restore(); }
  text(ctx, 'ANSWER', PANEL.x + 28, PANEL.y + 367, { font: `bold 12px ${FONT_UI}`, color: COL.gold });
  inputBox(ctx, PANEL.x + 100, PANEL.y + 344, 380, p.buf, c.placeholder, p.t, true);
  messageLine(ctx, p.msg, p.kind, PANEL.y + 405);
  if (p.hintShown && c.hint) hintBox(ctx, c.hint, PANEL.y + 414);
}
function renderTerminal(ctx, p) {
  const c0 = p.cur ? p.cur() : {}, hOK = c0.allowed ? !c0.allowed.test('h') : false;
  panelFrame(ctx, p.title, { footer: hOK ? 'Enter submit  ·  H hint  ·  Esc close' : 'Enter submit  ·  F1 or Hint button  ·  Esc close' });
  const x = PANEL.x + 28, y = PANEL.y + 66, w = PANEL.w - 56, h = 372;
  ctx.save(); ctx.fillStyle = '#03080a'; rr(ctx, x, y, w, h, 6); ctx.fill();
  ctx.beginPath(); rr(ctx, x, y, w, h, 6); ctx.clip();
  // wrapped log, newest at bottom
  ctx.font = `15px ${FONT_MONO}`;
  const lines = [];
  for (const l of p.log) for (const s of wrap(ctx, l.t, w - 40)) lines.push({ t: s, c: l.c });
  const maxLines = 15, show = lines.slice(-maxLines);
  show.forEach((l, i) => text(ctx, l.t, x + 16, y + 26 + i * 21, { font: `15px ${FONT_MONO}`, color: l.c }));
  // input line
  const iy = y + h - 34;
  ctx.fillStyle = 'rgba(79,227,255,.08)'; ctx.fillRect(x, iy - 12, w, 34);
  text(ctx, '> ' + p.buf, x + 16, iy + 10, { font: `16px ${FONT_MONO}`, color: '#e9f6ff' });
  const cw = ctx.measureText('> ' + p.buf).width;
  if (Math.floor(p.t * 2) % 2 === 0 && !p.done) { ctx.fillStyle = COL.cyan; ctx.fillRect(x + 18 + cw, iy - 4, 9, 17); }

  // scanlines
  ctx.globalAlpha = 0.07; ctx.fillStyle = '#7fffd4'; for (let yy = y; yy < y + h; yy += 3) ctx.fillRect(x, yy, w, 1);
  ctx.restore();
}

   TRACE — terminal command with animated hops
   ============================================================ */
const TRACE_HOPS = [
  ['1', 'IX-CORE           10.0.0.1        1 ms'],
  ['2', 'MANOR-LINK-A      198.51.100.1    6 ms'],
  ['3', 'MANOR-LINK-B      198.51.100.9   11 ms'],
  ['4', 'STORAGE-GATEWAY   203.0.113.42   14 ms   << destination reached'],

function makeTrace() {
  return {
    id: 'trace', title: 'Trace terminal', terminal: true, clickAdvances() { return this.finished; }, t: 0, buf: '', done: false, hopI: -1, hopT: 0, finished: false, log: [
      { t: 'PORT LOGIC EXCHANGE — TRACE TERMINAL v2.1', c: COL.ok },
      { t: `Operator: RHONDA ROUTER   Guest: ${(G.name || 'Detective').toUpperCase()}`, c: COL.dim },
      { t: 'Case note: the threat email was sent from IP address 203.0.113.42.', c: COL.cream },
      { t: 'Usage:  trace <ip-address>', c: COL.dim }, { t: '', c: COL.dim },
    ],
    onSolved: afterTrace, hintShown: false,
    showHint() { if (!this.hintShown) { this.hintShown = true; G.stats.hints++; } this.log.push({ t: 'PIP (radio): Type exactly   trace 203.0.113.42   and press Enter.', c: COL.gold }); },
    cur() { return { placeholder: this.hopI < 0 ? 'trace 203.0.113.42' : '' }; },
    key(k) {
      if (this.finished) { if (k === 'Enter') finishPuzzle(); return; }
      if (this.hopI >= 0) return;                       // animating
      if (k === 'Enter') { this.submit(); return; }
      if (k === 'Backspace') { this.buf = this.buf.slice(0, -1); return; }
      if (k === 'F1') { this.showHint(); return; }
      if (k.length === 1 && /[a-zA-Z0-9. ]/.test(k) && this.buf.length < 40) { this.buf += k; SFX.tick(); }
    },
    submit() {
      const a = this.buf.trim(); if (!a) return;
      this.log.push({ t: '> ' + a, c: COL.cyan }); this.buf = '';
      const parts = a.toLowerCase().split(/\s+/), cmd = parts[0], arg = parts[1];
      if (cmd === 'help') { this.log.push({ t: 'Commands:  trace <ip-address>   — follows the route to that address, hop by hop', c: COL.dim }); return; }
      if (['trace', 'traceroute', 'tracert'].includes(cmd)) {
        if (!arg) { this.log.push({ t: 'usage: trace <ip-address>   (the address is in the case note above)', c: COL.bad }); return; }
        if (arg === '203.0.113.42') { solvedPuzzle('trace'); this.log.push({ t: 'Tracing route to 203.0.113.42 over a maximum of 30 hops…', c: COL.cream }); this.hopI = 0; this.hopT = 0; SFX.blip(); return; }
        if (/^\d{1,3}(\.\d{1,3}){3}$/.test(arg)) { wrongAnswer('trace'); SFX.bad(); this.log.push({ t: `Tracing route to ${arg}…   * * *   request timed out. Nobody answers at that address.`, c: COL.bad }); this.log.push({ t: 'Check the address in the case note: it is the sender of the threat.', c: COL.dim }); return; }
        wrongAnswer('trace'); SFX.bad(); this.log.push({ t: `"${arg}" is not an IP address. An IP address is four numbers from 0 to 255 separated by dots.`, c: COL.bad }); return;
      }
      SFX.bad(); this.log.push({ t: `Unknown command "${cmd}". Try:  trace 203.0.113.42`, c: COL.bad });
    },
    update(dt) {
      this.t += dt;
      if (this.hopI >= 0 && !this.finished) {
        this.hopT += dt;
        if (this.hopT > 0.75) {
          this.hopT = 0; SFX.tick();
          if (this.hopI < TRACE_HOPS.length) { const h = TRACE_HOPS[this.hopI]; this.log.push({ t: `  ${h[0]}   ${h[1]}`, c: this.hopI === 3 ? COL.ok : COL.cream }); this.hopI++; }
          else if (this.hopI === TRACE_HOPS.length) { this.log.push({ t: 'WHOIS 203.0.113.42 → Storage Manor, 8 Dataway Drive. Account holder: R. STORAGE.', c: '#ffd166' }); this.hopI++; }
          else if (this.hopI === TRACE_HOPS.length + 1) { this.log.push({ t: 'DNS   storagemanor.net → 203.0.113.42   (name matches the address)', c: '#ffd166' }); this.hopI++; }
          else { this.log.push({ t: 'Trace complete. Press Enter to continue.', c: COL.ok }); this.finished = true; SFX.ok(); }
        }
      }
    },
    render(ctx) { renderTerminal(ctx, this); },
  };
}

  const TTL = 6;

    id: 'packetrun', title: 'Packet Run — reach LAB-RTR', t: 0, at: 'IX-CORE', ttl: TTL, path: ['IX-CORE'], anim: null, done: false, doneT: 0, dropped: false, dropT: 0,
    msg: 'You are at IX-CORE. Find LAB-RTR in the routing table and choose that next hop.', kind: 'info', hintShown: false, onSolved: afterPacketRun,
    showHint() { if (!this.hintShown) { this.hintShown = true; G.stats.hints++; } const row = NET.tables[this.at].find(r => r[0] === 'LAB-RTR'); this.msg = row ? `Pip: the table row for LAB-RTR says next hop ${row[1]}. Press its number.` : 'Pip: you have arrived!'; this.kind = 'info'; },
    key(k) {

        ctx.strokeStyle = isDest ? COL.ok : isAt ? COL.cyan : '#3b4a66'; ctx.lineWidth = isAt || isDest ? 2.5 : 1.2; rr(ctx, n.x - 34, n.y - 16, 68, 32, 5); ctx.stroke();

/* ---------- movement ---------- */
function rectHit(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
