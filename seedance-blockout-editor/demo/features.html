<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockout Feature Clips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #stage { position: relative; background: #000; transform-origin: 50% 50%; flex: none; overflow: hidden; }
  #ed { position: absolute; left: 0; top: 0; transform-origin: 0 0; border: 0; pointer-events: none; background: #000; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  #cap { position: absolute; font: 600 26px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #F4F4F1; white-space: nowrap; }
  #res { position: absolute; background: #0C0C0C; overflow: hidden; }
  #res video, #res img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #res .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 18px/1.3 'IBM Plex Mono', monospace; color: #555; text-align: center; letter-spacing: .04em; }
  /* a plain system pointer (arrow / open hand / closed hand), drawn at the editor's UI scale */
  .ptr { position: absolute; left: 0; top: 0; z-index: 9; will-change: transform; opacity: 0; }
  #arrow { width: 36px; height: 54px; margin: 0; transform-origin: 0 0; }
  #hand, #fist { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
  body.edit .box { outline: 2px dashed #3d7bff; pointer-events: auto; cursor: move; }
  body.edit #ov { pointer-events: none; } body.edit .box { z-index: 20; }
  #lm { position: fixed; left: 8px; top: 8px; z-index: 50; font: 12px system-ui; color: #ccc; background: #111d; padding: 6px 8px; display: none; white-space: pre; max-width: 46vw; }
  body.edit #lm { display: block; }
  #hint { position: fixed; left: 12px; bottom: 10px; font: 12px system-ui; color: #666; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <iframe id="ed" title="Blockout editor"></iframe>
  <div id="ov">
    <div id="res" class="box" data-k="res"><div class="ph">Seedance render<br>(synced slot)</div></div>
    <div id="cap" class="box" data-k="cap"></div>
    <svg id="arrow" class="ptr" viewBox="0 0 12 18"><path d="M1 1 V15.2 L4.4 12 L6.6 17 L8.8 16 L6.7 11.2 H11.2 Z" fill="#000" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>
    <svg id="hand" class="ptr" viewBox="0 0 20 20"><path d="M6 9.5 V4.2 a1.1 1.1 0 0 1 2.2 0 V8.6 V3.1 a1.1 1.1 0 0 1 2.2 0 V8.6 V3.7 a1.1 1.1 0 0 1 2.2 0 V9 V5.6 a1.1 1.1 0 0 1 2.2 0 V12.2 c0 3.6 -2.2 5.9 -5.3 5.9 c-2.4 0 -3.7 -1.2 -4.8 -3.1 l-2 -3.4 a1.1 1.1 0 0 1 1.9 -1.2 Z" fill="#fff" stroke="#000" stroke-width="0.9" stroke-linejoin="round"/></svg>
    <svg id="fist" class="ptr" viewBox="0 0 20 20"><path d="M5 10 V8.3 a1.1 1.1 0 0 1 2.2 0 V9 V7.6 a1.1 1.1 0 0 1 2.2 0 V9 V7.7 a1.1 1.1 0 0 1 2.2 0 V9.3 V8.4 a1.1 1.1 0 0 1 2.2 0 V12.2 c0 3.3 -2 5.4 -5 5.4 c-2.4 0 -3.7 -1.2 -4.5 -2.9 l-1 -2.5 a1.1 1.1 0 0 1 1.5 -1.4 Z" fill="#fff" stroke="#000" stroke-width="0.9" stroke-linejoin="round"/></svg>
  </div>
</div></div>
<div id="lm"></div>
<div id="hint">Space: play / pause · R: restart · L: layout mode</div>
<script type="module" src="features.js?v=st2"></script>
</body>
</html>
